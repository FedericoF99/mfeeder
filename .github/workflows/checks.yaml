name: Checks

on:
  workflow_call:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Show Go version
        run: go version

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...
